<style>
  :root {
    --green: #0F9D58;
    --green-dark: #0b7a44;
    --red: #d9534f;
    --orange: #f0ad4e;
    --blue: #4a90d9;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #222;
    --muted: #888;
    --border: #e3e6ea;
    --chip-bg: #eef2f5;
    --bar-bg: #eee;
    --week-a: #ffffff;
    --week-b: #eaf3ff;
  }
  html.dark-mode {
    --bg: #14161a;
    --card: #1e2126;
    --text: #e9e9ea;
    --muted: #9aa0a6;
    --border: #33373f;
    --chip-bg: #2a2e35;
    --bar-bg: #2a2e35;
    --week-a: #1e2126;
    --week-b: #262b33;
  }
  html.dark-mode input, html.dark-mode select {
    background: #262a30; color: var(--text); border-color: var(--border);
  }
  html.dark-mode .ai-msg.bot { background: var(--chip-bg); color: var(--text); }
  html.dark-mode .toast { background: #444; }
  html.dark-mode .tag-in { background: #16321f; color: #7fd99a; }
  html.dark-mode .tag-out { background: #3a1a1a; color: #f29c9c; }
  html.dark-mode .tag-transfer { background: #3a2c14; color: #f0c27b; }
  html {
    background: var(--bg);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
  }
  .center-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: var(--card); border-radius: 12px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .login-card { width: 300px; text-align: center; }
  .login-card h1 { margin-bottom: 4px; }
  .muted { color: var(--muted); font-size: 13px; }
  input, select, button { font-family: inherit; font-size: 14px; }
  input, select {
    width: 100%; padding: 9px 10px; margin-top: 6px; margin-bottom: 10px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card);
  }
  .btn { border: none; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-secondary { background: var(--blue); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: var(--red); color: #fff; }
  .full { width: 100%; }
  .error-text { color: var(--red); font-size: 13px; min-height: 16px; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--border);
    flex-wrap: wrap; gap: 8px;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-left h2 { margin: 0; font-size: 18px; }
  .badge { background: var(--green); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 20px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .ledger-switch { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .ledger-switch button {
    border: none; background: var(--card); padding: 7px 14px; cursor: pointer; font-weight: 600; color: var(--text);
  }
  .ledger-switch button.active { background: var(--green); color: #fff; }

  .tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 20px; }
  .tab-btn {
    border: none; background: transparent; padding: 12px 16px; cursor: pointer;
    font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent;
  }
  .tab-btn.active { color: var(--green); border-bottom-color: var(--green); }

  .content { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .period-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .period-bar select { width: auto; margin: 0; }

  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; margin-bottom: 14px; }
  .summary-card { border-radius: 10px; padding: 14px; color: #fff; }
  .summary-card.income { background: #43a047; }
  .summary-card.expense { background: #e53935; }
  .summary-card.transfer-in { background: #fb8c00; }
  .summary-card.transfer-out { background: #8d6e63; }
  .summary-label { display: block; font-size: 12px; opacity: .9; }
  .summary-value { display: block; font-size: 20px; font-weight: 700; margin-top: 4px; }

  .saldo-bar {
    background: #0F9D58; color: #fff; padding: 14px 18px; border-radius: 10px;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;
    font-weight: 600;
  }
  .saldo-bar strong { font-size: 20px; }

  .rincian-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .rincian-grid { grid-template-columns: 1fr; } }
  .rincian-box h3 { margin-top: 0; font-size: 14px; }
  .rincian-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .rincian-bar-bg { background: var(--bar-bg); border-radius: 6px; height: 6px; margin-top: 4px; overflow: hidden; }

  .icon-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 14px;
  }
  #langSelect { width: auto; margin: 0; padding: 7px 8px; }
  .rincian-bar-fill { background: var(--green); height: 100%; }

  .rincian-box canvas { max-width: 100%; }
  .chart-wrap { position: relative; height: 260px; width: 100%; }

  .form-card { margin-bottom: 16px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .form-grid label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); font-weight: 600; }
  .form-grid .span2 { grid-column: 1 / -1; }
  @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; white-space: nowrap; }
  thead th { background: var(--green); color: #fff; position: sticky; top: 0; }
  tbody tr { border-bottom: 1px solid var(--border); }
  .row-week-a { background: var(--week-a); }
  .row-week-b { background: var(--week-b); }
  .tag { padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .tag-in { background: #e8f5e9; color: #2e7d32; }
  .tag-out { background: #ffebee; color: #c62828; }
  .tag-transfer { background: #fff3e0; color: #ef6c00; }
  .row-actions button { border: none; background: transparent; cursor: pointer; font-size: 14px; padding: 2px 4px; }

  .pengaturan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .pengaturan-grid { grid-template-columns: 1fr; } }
  .add-row { display: flex; gap: 8px; }
  .add-row input { margin: 0; }
  .chip-list { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-list li {
    background: var(--chip-bg); border-radius: 20px; padding: 6px 10px 6px 14px;
    display: flex; align-items: center; gap: 6px; font-size: 13px;
  }
  .chip-list li button { border: none; background: transparent; cursor: pointer; color: var(--red); font-weight: 700; }

  .ai-log {
    max-height: 320px; overflow-y: auto; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; margin-bottom: 12px; background: var(--bg);
    min-height: 160px;
  }
  .ai-empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 140px; text-align: center; color: var(--muted); gap: 4px;
  }
  .ai-empty-icon { font-size: 32px; opacity: .6; margin-bottom: 4px; }
  .ai-empty-state p { margin: 0; }
  .ai-msg { padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 13px; max-width: 85%; }
  .ai-msg.user { background: var(--green); color: #fff; margin-left: auto; }
  .ai-msg.bot { background: #eef2f5; color: var(--text); }
  #adminSection .card { border: 1px dashed var(--border); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #333; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px;
    transition: transform .25s ease; z-index: 999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
