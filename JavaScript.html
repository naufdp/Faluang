  };

  let CURRENT_LANG = localStorage.getItem('faluang_lang') || 'id';

  function setLanguage(lang) {
    CURRENT_LANG = lang;
    localStorage.setItem('faluang_lang', lang);
    applyLanguage();
    refreshBulanOptions();
  }

  function refreshBulanOptions() {
    const bulanSel = document.getElementById('periodBulan');
    if (!bulanSel) return;
    const currentValue = bulanSel.value;
    bulanSel.innerHTML = getBulanNamaList().map((b, i) => `<option value="${i+1}">${b}</option>`).join('');
    if (currentValue) bulanSel.value = currentValue;
  }

  function applyLanguage() {
    const dict = I18N[CURRENT_LANG] || I18N.id;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key]) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (dict[key]) el.setAttribute('placeholder', dict[key]);
    });
    document.getElementById('langSelect').value = CURRENT_LANG;
  }

  function toggleDarkMode() {
    const isDark = document.documentElement.classList.toggle('dark-mode');
    localStorage.setItem('faluang_dark', isDark ? '1' : '0');
    document.getElementById('darkModeBtn').innerText = isDark ? '☀️' : '🌙';
    // Chart.js tidak otomatis re-render warna teks/grid saat tema berubah,
    // jadi grafik yang sedang tampil kita gambar ulang.
    if (chartPengeluaran) chartPengeluaran.destroy();
    if (chartArusKas) chartArusKas.destroy();
    if (document.getElementById('appScreen').style.display !== 'none') {
      loadDashboard(); loadArusKas();
    }
  }

  function initTheme() {
    if (localStorage.getItem('faluang_dark') === '1') {
      document.documentElement.classList.add('dark-mode');
      document.getElementById('darkModeBtn').innerText = '☀️';
    }
    applyLanguage();
  }

  /* ============== BOOT ============== */
  window.addEventListener('DOMContentLoaded', () => {
    initTheme();
    google.script.run.withSuccessHandler(me => {
      const el = document.getElementById('setupWhoAmI');
      if (el) el.innerText = 'Masuk sebagai: ' + me.email;
    }).getMe();

    google.script.run.withSuccessHandler(status => {
      if (!status.configured) {
        document.getElementById('setupScreen').style.display = 'flex';
      } else {
        document.getElementById('loginScreen').style.display = 'flex';
      }
    }).withFailureHandler(showErr).getAppStatus();
  });

  /* ============== SETUP WIZARD ============== */
  function doSetup() {
    const val = document.getElementById('setupInput').value.trim();
    if (!val) return;
    document.getElementById('setupError').innerText = '';
    google.script.run.withSuccessHandler(res => {
      if (!res.ok) { document.getElementById('setupError').innerText = res.error; return; }
      document.getElementById('setupScreen').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      toast('Terhubung ke: ' + res.spreadsheetName);
    }).withFailureHandler(showErr).saveSpreadsheetId(val);
  }

  /* ============== LOGIN / LOGOUT ============== */
  function doLogin() {
    const pin = document.getElementById('pinInput').value.trim();
    if (!pin) return;
    document.getElementById('loginError').innerText = '';
    google.script.run.withSuccessHandler(res => {
      if (!res.ok) { document.getElementById('loginError').innerText = 'PIN salah, coba lagi.'; return; }
      CURRENT_ROLE = res.role;
      CURRENT_USER_ROW = res.rowIndex;
      ACCESSIBLE_LEDGERS = res.akses;
      CURRENT_LEDGER = ACCESSIBLE_LEDGERS[0] || null;
      initApp(res.nama);
    }).withFailureHandler(showErr).login(pin);
  }

  function logout() {
    CURRENT_ROLE = null;
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('pinInput').value = '';
  }

  /* ============== INIT APP ============== */
  function initApp(nama) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    document.getElementById('roleBadge').innerText = nama + ' (' + CURRENT_ROLE + ')';

    renderLedgerSwitch();
    document.getElementById('adminSection').style.display = CURRENT_ROLE === 'admin' ? 'block' : 'none';
    applyRolePermissions();
    setupPeriodSelectors();

    if (!CURRENT_LEDGER) { toast('Kamu belum punya akses ke ledger manapun. Hubungi admin.'); return; }
    refreshAll();
  }

  function renderLedgerSwitch() {
    const wrap = document.getElementById('ledgerSwitch');
    wrap.innerHTML = '';
    ACCESSIBLE_LEDGERS.forEach(l => {
      const b = document.createElement('button');
      b.innerText = l;
      b.dataset.ledger = l;
      b.onclick = () => { CURRENT_LEDGER = l; updateLedgerButtons(); AI_HISTORY = []; refreshAll(); };
      wrap.appendChild(b);
    });
    updateLedgerButtons();
  }

  function updateLedgerButtons() {
    document.querySelectorAll('.ledger-switch button').forEach(b => b.classList.toggle('active', b.dataset.ledger === CURRENT_LEDGER));
  }

  function applyRolePermissions() {
    const readOnly = CURRENT_ROLE === 'viewer';
    document.getElementById('transaksiFormWrap').style.display = readOnly ? 'none' : 'block';
    document.querySelectorAll('#tab-pengaturan .add-row').forEach(el => {
      if (!el.closest('#adminSection')) el.style.display = readOnly ? 'none' : 'flex';
    });
  }

  function refreshAll() {
    loadPengaturan();
    loadDashboard();
    loadTransaksi();
    loadArusKas();
    showAiEmptyState();
    if (CURRENT_ROLE === 'admin') { loadLedgersUI(); loadUsersUI(); loadSpreadsheetInfo(); loadAiStatus(); }
  }

  /* ============== TABS ============== */
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');

    // Chart.js menghitung ukuran canvas saat dibuat; kalau tab-nya waktu itu
    // masih tersembunyi, ukurannya jadi 0 dan grafik tampak kosong.
    // Resize ulang begitu tab-nya benar-benar terlihat.
    setTimeout(() => {
      if (tab === 'dashboard' && chartPengeluaran) chartPengeluaran.resize();
      if (tab === 'aruskas' && chartArusKas) chartArusKas.resize();
    }, 50);
  }

  /* ============== PERIOD ============== */
  function setupPeriodSelectors() {
    const bulanSel = document.getElementById('periodBulan');
    bulanSel.innerHTML = getBulanNamaList().map((b, i) => `<option value="${i+1}">${b}</option>`).join('');
    const now = new Date();
    bulanSel.value = now.getMonth() + 1;

    const tahunSel = document.getElementById('periodTahun');
    let opts = '';
    for (let y = now.getFullYear() - 3; y <= now.getFullYear() + 1; y++) opts += `<option value="${y}">${y}</option>`;
    tahunSel.innerHTML = opts;
    tahunSel.value = now.getFullYear();
  }

  function onPeriodTypeChange() {
    const type = document.getElementById('periodType').value;
    document.getElementById('periodBulan').style.display = type === 'bulanan' ? 'inline-block' : 'none';
    document.getElementById('periodMinggu').style.display = type === 'mingguan' ? 'inline-block' : 'none';
    if (type === 'mingguan') loadDaftarMinggu();
    loadDashboard();
    loadArusKas();
  }

  function loadDaftarMinggu() {
    google.script.run.withSuccessHandler(list => {
      document.getElementById('periodMinggu').innerHTML = list.map(w => `<option value="${w}">${w}</option>`).join('');
    }).withFailureHandler(showErr).getDaftarMinggu(CURRENT_LEDGER);
  }

  function currentPeriodParams() {
    return {
      type: document.getElementById('periodType').value,
      bulan: document.getElementById('periodBulan').value,
      tahun: document.getElementById('periodTahun').value,
      minggu: document.getElementById('periodMinggu').value
    };
  }

  /* ============== DASHBOARD ============== */
  function loadDashboard() {
    const p = currentPeriodParams();
    google.script.run.withSuccessHandler(renderDashboard).withFailureHandler(showErr)
      .getDashboard(CURRENT_LEDGER, p.type, p);
  }

  function renderDashboard(d) {
    document.getElementById('sumPemasukan').innerText = rupiah(d.pemasukan);
    document.getElementById('sumPengeluaran').innerText = rupiah(d.pengeluaran);
    document.getElementById('sumTransferMasuk').innerText = rupiah(d.transferMasuk);
    document.getElementById('sumTransferKeluar').innerText = rupiah(d.transferKeluar);
    document.getElementById('saldoBersih').innerText = rupiah(d.saldoBersih);
    document.getElementById('rincianPengeluaran').innerHTML = renderRincian(d.rincianPengeluaran);
    renderChartPengeluaran(d.rincianPengeluaran);
  }

  function renderRincian(list) {
    if (!list.length) return '<p class="muted">Belum ada data.</p>';
    return list.map(r => `
      <div class="rincian-row-wrap">
        <div class="rincian-row"><span>${r.kategori}</span><span>${rupiah(r.jumlah)} (${r.persen.toFixed(1)}%)</span></div>
        <div class="rincian-bar-bg"><div class="rincian-bar-fill" style="width:${r.persen}%"></div></div>
      </div>`).join('');
  }

  function chartThemeColors() {
    const dark = document.documentElement.classList.contains('dark-mode');
    return {
      text: dark ? '#e9e9ea' : '#222',
      grid: dark ? '#33373f' : '#e3e6ea'
    };
  }

  function renderChartPengeluaran(list) {
    const ctx = document.getElementById('chartPengeluaran');
    const c = chartThemeColors();
    if (chartPengeluaran) chartPengeluaran.destroy();
    chartPengeluaran = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: list.map(r => r.kategori),
        datasets: [{ label: 'Pengeluaran (Rp)', data: list.map(r => r.jumlah), backgroundColor: '#e53935' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: c.text }, grid: { color: c.grid } },
          y: { ticks: { color: c.text }, grid: { color: c.grid } }
        }
      }
    });
  }

  /* ============== ARUS KAS ============== */
  function loadArusKas() {
    const p = currentPeriodParams();
    google.script.run.withSuccessHandler(renderArusKas).withFailureHandler(showErr)
      .getArusKas(CURRENT_LEDGER, p.type, p);
  }

  function renderArusKas(list) {
    document.getElementById('arusKasBody').innerHTML = list.map(r => `
      <tr><td>${r.akun}</td><td>${rupiah(r.masukPeriode)}</td><td>${rupiah(r.keluarPeriode)}</td><td><strong>${rupiah(r.saldoSaatIni)}</strong></td></tr>
    `).join('') || '<tr><td colspan="4" class="muted">Belum ada data</td></tr>';

    const ctx = document.getElementById('chartArusKas');
    const c = chartThemeColors();
    if (chartArusKas) chartArusKas.destroy();
    chartArusKas = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: list.map(r => r.akun),
        datasets: [
          { label: 'Pemasukan', data: list.map(r => r.masukPeriode), backgroundColor: '#43a047' },
          { label: 'Pengeluaran', data: list.map(r => r.keluarPeriode), backgroundColor: '#e53935' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: c.text } } },
        scales: {
          x: { ticks: { color: c.text }, grid: { color: c.grid } },
          y: { ticks: { color: c.text }, grid: { color: c.grid } }
        }
      }
    });
  }

  /* ============== PENGATURAN: KATEGORI/AKUN ============== */
  function loadPengaturan() {
    google.script.run.withSuccessHandler(res => {
      PENGATURAN_CACHE = res;
      renderPengaturanLists();
      populateFormSelects();
    }).withFailureHandler(showErr).getPengaturan(CURRENT_LEDGER);
  }

  function renderPengaturanLists() {
    const readOnly = CURRENT_ROLE === 'viewer';
    document.getElementById('listKategori').innerHTML = PENGATURAN_CACHE.kategori.map(k =>
      `<li>${k} ${readOnly ? '' : `<button onclick="removePengaturan('kategori','${escapeQ(k)}')">×</button>`}</li>`).join('');
    document.getElementById('listAkun').innerHTML = PENGATURAN_CACHE.akun.map(a =>
      `<li>${a} ${readOnly ? '' : `<button onclick="removePengaturan('akun','${escapeQ(a)}')">×</button>`}</li>`).join('');
  }

  function populateFormSelects() {
    document.getElementById('fKategori').innerHTML = PENGATURAN_CACHE.kategori.map(k => `<option>${k}</option>`).join('');
    document.getElementById('fAkun').innerHTML = PENGATURAN_CACHE.akun.map(a => `<option>${a}</option>`).join('');
  }

  function addPengaturan(kolom) {
    const inputId = kolom === 'kategori' ? 'newKategori' : 'newAkun';
    const val = document.getElementById(inputId).value.trim();
    if (!val) return;
    google.script.run.withSuccessHandler(res => {
      PENGATURAN_CACHE = res; renderPengaturanLists(); populateFormSelects();
      document.getElementById(inputId).value = ''; toast('Ditambahkan');
    }).withFailureHandler(showErr).addPengaturanItem(CURRENT_LEDGER, kolom, val);
  }

  function removePengaturan(kolom, value) {
    if (!confirm(`Hapus "${value}"?`)) return;
    google.script.run.withSuccessHandler(res => {
      PENGATURAN_CACHE = res; renderPengaturanLists(); populateFormSelects(); toast('Dihapus');
    }).withFailureHandler(showErr).deletePengaturanItem(CURRENT_LEDGER, kolom, value);
  }

  /* ============== TRANSAKSI ============== */
  function loadTransaksi() {
    google.script.run.withSuccessHandler(renderTransaksiTable).withFailureHandler(showErr).getTransaksi(CURRENT_LEDGER);
  }

  function renderTransaksiTable(rows) {
    const readOnly = CURRENT_ROLE === 'viewer';
    let lastWeek = null, colorIdx = 0;
    const body = rows.map(r => {
      if (r.minggu !== lastWeek) { colorIdx = 1 - colorIdx; lastWeek = r.minggu; }
      const rowClass = colorIdx === 0 ? 'row-week-a' : 'row-week-b';
      const tagClass = r.tipe === 'Pemasukan' ? 'tag-in' : r.tipe === 'Pengeluaran' ? 'tag-out' : 'tag-transfer';
      return `<tr class="${rowClass}">
        <td>${r.no}</td><td>${r.tanggal}</td><td><span class="tag ${tagClass}">${r.tipe}</span></td>
        <td>${r.kategori}</td><td>${r.akun}</td><td>${r.deskripsi || ''}</td>
        <td>${r.debit ? rupiah(r.debit) : ''}</td><td>${r.kredit ? rupiah(r.kredit) : ''}</td>
        <td>${rupiah(r.saldoAkhir)}</td>
        <td class="row-actions">${readOnly ? '' : `<button onclick='editTransaksi(${JSON.stringify(r)})'>✏️</button><button onclick="removeTransaksi(${r.rowIndex})">🗑️</button>`}</td>
      </tr>`;
    }).join('');
    document.getElementById('transaksiBody').innerHTML = body || '<tr><td colspan="10" class="muted" style="text-align:center">Belum ada transaksi</td></tr>';
  }

  function submitTransaksi() {
    const form = {
      tanggal: document.getElementById('fTanggal').value,
      tipe: document.getElementById('fTipe').value,
      kategori: document.getElementById('fKategori').value,
      akun: document.getElementById('fAkun').value,
      deskripsi: document.getElementById('fDeskripsi').value,
      jumlah: document.getElementById('fJumlah').value
    };
    if (!form.tanggal || !form.jumlah) { toast('Tanggal & jumlah wajib diisi'); return; }
    const rowIndex = document.getElementById('editRowIndex').value;
    const after = (rows) => { renderTransaksiTable(rows); resetForm(); loadDashboard(); loadArusKas(); toast('Tersimpan'); };
    if (rowIndex) google.script.run.withSuccessHandler(after).withFailureHandler(showErr).updateTransaksi(CURRENT_LEDGER, rowIndex, form);
    else google.script.run.withSuccessHandler(after).withFailureHandler(showErr).addTransaksi(CURRENT_LEDGER, form);
  }

  function editTransaksi(r) {
    document.getElementById('editRowIndex').value = r.rowIndex;
    document.getElementById('formTitle').innerText = 'Edit Transaksi #' + r.no;
    document.getElementById('fTanggal').value = toInputDate(r.tanggal);
    document.getElementById('fTipe').value = r.tipe;
    document.getElementById('fKategori').value = r.kategori;
    document.getElementById('fAkun').value = r.akun;
    document.getElementById('fDeskripsi').value = r.deskripsi;
    document.getElementById('fJumlah').value = r.debit || r.kredit;
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    switchTab('transaksi'); window.scrollTo(0,0);
  }

  function removeTransaksi(rowIndex) {
    if (!confirm('Hapus transaksi ini? Baris di spreadsheet juga akan ikut terhapus.')) return;
    google.script.run.withSuccessHandler(rows => { renderTransaksiTable(rows); loadDashboard(); loadArusKas(); toast('Dihapus'); })
      .withFailureHandler(showErr).deleteTransaksi(CURRENT_LEDGER, rowIndex);
  }

  function resetForm() {
    document.getElementById('editRowIndex').value = '';
    document.getElementById('formTitle').innerText = 'Tambah Transaksi';
    document.getElementById('fTanggal').value = '';
    document.getElementById('fDeskripsi').value = '';
    document.getElementById('fJumlah').value = '';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }

  /* ============== TANYA AI ============== */
  let AI_HISTORY = [];

  function aiEmptyStateHtml() {
    const dict = I18N[CURRENT_LANG] || I18N.id;
    return `<div class="ai-empty-state">
      <div class="ai-empty-icon">💬</div>
      <p>${dict.ai_empty_title}</p>
      <p class="muted" style="font-size:12px">${dict.ai_empty_sub}</p>
    </div>`;
  }

  function showAiEmptyState() {
    document.getElementById('aiChatLog').innerHTML = aiEmptyStateHtml();
  }

  function askAiQuestion() {
    const q = document.getElementById('aiQuestion').value.trim();
    if (!q) return;
    appendAiMsg('user', q);
    document.getElementById('aiQuestion').value = '';
    appendAiMsg('bot', 'Mikir dulu...', true);

    google.script.run.withSuccessHandler(res => {
      removeAiThinking();
      if (res.ok) {
        AI_HISTORY.push({ role: 'user', text: q });
        AI_HISTORY.push({ role: 'model', text: res.answer });
        // batasi histori biar payload gak makin membengkak tiap chat
        if (AI_HISTORY.length > 20) AI_HISTORY = AI_HISTORY.slice(-20);
        appendAiMsg('bot', res.answer);
      } else {
        appendAiMsg('bot', '⚠️ ' + res.error);
      }
    }).withFailureHandler(e => { removeAiThinking(); appendAiMsg('bot', '⚠️ ' + e.message); })
      .askAI(CURRENT_LEDGER, q, AI_HISTORY);
  }

  function appendAiMsg(who, text, thinking) {
    const log = document.getElementById('aiChatLog');
    const emptyState = log.querySelector('.ai-empty-state');
    if (emptyState) emptyState.remove();

    const div = document.createElement('div');
    div.className = 'ai-msg ' + who;
    if (thinking) div.id = 'aiThinking';
    div.innerText = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  function removeAiThinking() {
    const el = document.getElementById('aiThinking');
    if (el) el.remove();
  }

  /* ============== PENGATURAN: GANTI PIN ============== */
  function submitChangePin() {
    const oldPin = document.getElementById('oldPin').value.trim();
    const newPin = document.getElementById('newPinInput').value.trim();
    if (!oldPin || !newPin) return;
    google.script.run.withSuccessHandler(res => {
      const msg = document.getElementById('pinChangeMsg');
      if (!res.ok) { msg.style.color = 'var(--red)'; msg.innerText = res.error; return; }
      msg.style.color = 'green'; msg.innerText = 'PIN berhasil diganti.';
      document.getElementById('oldPin').value = ''; document.getElementById('newPinInput').value = '';
    }).withFailureHandler(showErr).changeMyPin(CURRENT_USER_ROW, oldPin, newPin);
  }

  /* ============== ADMIN: LEDGER ============== */
  function loadLedgersUI() {
    google.script.run.withSuccessHandler(res => {
      renderLedgerList(res);
      document.getElementById('ledgerNamesList').innerHTML = res.map(l => `<option value="${l}">`).join('');
    }).withFailureHandler(showErr).getLedgers();
  }
  function renderLedgerList(list) {
    document.getElementById('listLedger').innerHTML = list.map(l =>
      `<li>${l} <button onclick="deleteLedgerUI('${escapeQ(l)}')">×</button></li>`).join('');
  }
  function addLedgerUI() {
    const name = document.getElementById('newLedgerName').value.trim();
    if (!name) return;
    google.script.run.withSuccessHandler(res => {
      if (!res.ok) { toast(res.error); return; }
      renderLedgerList(res.ledgers);
      document.getElementById('ledgerNamesList').innerHTML = res.ledgers.map(l => `<option value="${l}">`).join('');
      document.getElementById('newLedgerName').value = '';
      toast('Ledger ditambahkan');
    }).withFailureHandler(showErr).addLedger(name);
  }
  function deleteLedgerUI(name) {
    if (!confirm(`Hapus ledger "${name}"? Semua transaksi di dalamnya akan hilang permanen.`)) return;
    google.script.run.withSuccessHandler(res => {
      renderLedgerList(res.ledgers);
      document.getElementById('ledgerNamesList').innerHTML = res.ledgers.map(l => `<option value="${l}">`).join('');
      toast('Ledger dihapus');
    }).withFailureHandler(showErr).deleteLedger(name);
  }

  /* ============== ADMIN: USERS (tambah & edit) ============== */
  function loadUsersUI() {
    google.script.run.withSuccessHandler(renderUserTable).withFailureHandler(showErr).getUsers();
  }
  function renderUserTable(list) {
    document.getElementById('userTableBody').innerHTML = list.map(u => `
      <tr><td>${u.nama}</td><td>${u.akses}</td><td>${u.role}</td>
      <td>
        <button class="btn btn-ghost" onclick='editUserUI(${JSON.stringify(u)})'>Edit</button>
        <button class="btn btn-ghost" onclick="deleteUserUI(${u.rowIndex})">Hapus</button>
      </td></tr>
    `).join('');
  }

  function submitUserForm() {
    const rowIndex = document.getElementById('editUserRowIndex').value;
    const form = {
      nama: document.getElementById('newUserNama').value.trim(),
      pin: document.getElementById('newUserPin').value.trim(),
      akses: document.getElementById('newUserAkses').value.trim() || 'ALL',
      role: document.getElementById('newUserRole').value
    };

    if (rowIndex) {
      // Mode edit: PIN boleh dikosongkan supaya tidak berubah
      google.script.run.withSuccessHandler(res => {
        if (!res.ok) { toast(res.error); return; }
        renderUserTable(res.users);
        resetUserForm();
        toast('User diperbarui');
      }).withFailureHandler(showErr).updateUser(rowIndex, form);
    } else {
      if (!form.nama || !form.pin) { toast('Nama & PIN wajib diisi'); return; }
      google.script.run.withSuccessHandler(res => {
        if (!res.ok) { toast(res.error); return; }
        renderUserTable(res.users);
        resetUserForm();
        toast('User ditambahkan');
      }).withFailureHandler(showErr).addUser(form);
    }
  }

  function editUserUI(u) {
    document.getElementById('editUserRowIndex').value = u.rowIndex;
    document.getElementById('newUserNama').value = u.nama;
    document.getElementById('newUserPin').value = '';
    document.getElementById('newUserAkses').value = u.akses;
    document.getElementById('newUserRole').value = u.role;
    document.getElementById('userFormSubmitBtn').innerText = 'Simpan Perubahan';
    document.getElementById('cancelEditUserBtn').style.display = 'inline-block';
    document.getElementById('userFormHint').innerText = `Mengedit "${u.nama}". Kosongkan PIN kalau tidak mau menggantinya.`;
  }

  function resetUserForm() {
    document.getElementById('editUserRowIndex').value = '';
    document.getElementById('newUserNama').value = '';
    document.getElementById('newUserPin').value = '';
    document.getElementById('newUserAkses').value = 'ALL';
    document.getElementById('newUserRole').value = 'viewer';
    document.getElementById('userFormSubmitBtn').innerText = 'Tambah User';
    document.getElementById('cancelEditUserBtn').style.display = 'none';
    document.getElementById('userFormHint').innerText = 'Isi Akses dengan nama ledger persis sama (bisa lebih dari satu, pisahkan koma), atau ketik ALL untuk semua ledger.';
  }

  function deleteUserUI(rowIndex) {
    if (!confirm('Hapus user ini?')) return;
    google.script.run.withSuccessHandler(res => {
      if (!res.ok) { toast(res.error); return; }
      renderUserTable(res.users);
    }).withFailureHandler(showErr).deleteUser(rowIndex);
  }

  /* ============== ADMIN: SPREADSHEET ============== */
  function loadSpreadsheetInfo() {
    google.script.run.withSuccessHandler(status => {
      document.getElementById('currentSpreadsheetName').innerText = status.spreadsheetName || '-';
    }).withFailureHandler(showErr).getAppStatus();
  }
  function changeSpreadsheetUI() {
    const val = document.getElementById('changeSpreadsheetInput').value.trim();
    if (!val) return;
    if (!confirm('Yakin ingin memindahkan aplikasi ke spreadsheet lain?')) return;
    google.script.run.withSuccessHandler(res => {
      if (!res.ok) { toast(res.error); return; }
      toast('Berhasil pindah ke: ' + res.spreadsheetName);
      setTimeout(() => location.reload(), 1200);
    }).withFailureHandler(showErr).saveSpreadsheetId(val);
  }

  /* ============== ADMIN: AI KEY (Gemini) ============== */
  function loadAiStatus() {
    google.script.run.withSuccessHandler(res => {
      document.getElementById('geminiKeyStatus').innerText = res.isSet ? '✅ API key sudah terpasang.' : 'Belum ada API key terpasang.';
    }).withFailureHandler(showErr).getAiStatus();
  }
  function saveGeminiKeyUI() {
    const key = document.getElementById('geminiKeyInput').value.trim();
    if (!key) return;
    google.script.run.withSuccessHandler(res => {
      document.getElementById('geminiKeyInput').value = '';
      loadAiStatus();
      toast('API key disimpan');
    }).withFailureHandler(showErr).saveGeminiKey(key);
  }

  /* ============== HELPERS ============== */
  function enterSubmit(e, fn) {
    if (e.key === 'Enter') {
      e.preventDefault();
      fn();
    }
  }
  function rupiah(n) { n = Number(n) || 0; return 'Rp ' + n.toLocaleString('id-ID'); }
  function toInputDate(ddmmyyyy) { const [d,m,y] = ddmmyyyy.split('/'); return `${y}-${m}-${d}`; }
  function escapeQ(s) { return String(s).replace(/'/g, "\\'"); }
  function toast(msg) {
    const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
  function showErr(e) { console.error(e); toast('Error: ' + (e.message || e)); }
</script>
